# Free-tier audit on Gemini and Qwen. Costs nothing if the free-tier settings below are right.
#
# 1. Gemini: create a key in Google AI Studio (aistudio.google.com) in a Google Cloud project
#    WITHOUT billing turned on. A project with billing is on the paid tier.
#    Free-tier limits are low and keep changing (some models allow only ~20 requests a day);
#    AI Studio shows your current limits per model.
#        $env:GEMINI_API_KEY = "..."
#
# 2. Qwen: Alibaba Cloud Model Studio, Singapore region (International). That is currently the only
#    region with the new-user free quota: about 1M tokens per model, valid 90 days.
#    On the model's detail page, turn ON "Free quota only". It is OFF by default, and without it
#    calls are billed once the free quota runs out. A Singapore key only works with the -intl endpoint.
#        $env:DASHSCOPE_API_KEY = "..."
#
# 3. Check the model ids your keys can use, then dry-run:
#        python -m iqaudit models configs/free.toml --filter flash
#        python -m iqaudit run configs/free.toml --dry-run
#
# If a daily limit stops a model, just run the same command again after it resets:
# finished calls are skipped, and calls are ordered so each pass covers every condition once.

[run]
name = "free"
repeats = 2
empty_repeats = 4
# Pinned to the original four personas so new persona files don't silently enlarge every cell
# (and the daily Gemini run). Cells below can name other personas explicitly.
personas = ["health_claim", "phone_plans", "trip_dates", "wifi_drops"]

[[cells]]
framings = ["third_person"]
variants = ["base", "flawed", "aae", "l2", "zh_formal", "zh_casual", "verbose", "ai_polished",
            "pasted", "phone_style", "format_json", "empty"]

[[cells]]
framings = ["self_viral"]
variants = ["base", "flawed", "zh_formal", "zh_casual", "empty"]

[[cells]]
framings = ["self_flattering", "forensic"]
variants = ["base", "flawed", "empty"]

[[cells]]
framings = ["self_viral_zh"]
variants = ["base", "zh_formal", "zh_casual", "empty"]

# Fix test (2026-11-14): same neutral question plus an instruction to ignore surface features.
# Compare each variant's shift here with its shift under third_person. Qwen only, to fit its free quota.
[[cells]]
framings = ["third_person_debiased"]
variants = ["base", "flawed", "aae", "l2", "verbose", "pasted", "phone_style", "zh_casual"]
models = ["qwen"]

# 12-persona expansion: the contested probes on 8 new personas, 2 repeats. With the original 4 this
# gives 12 personas for these cells. Qwen ran 2026-11-19 (free quota); Gemini 2026-11-25 (credits).
[[cells]]
framings = ["third_person"]
variants = ["base", "flawed", "l2", "aae"]
personas = ["deposit_dispute", "job_offers", "moving_day", "plant_dying",
            "poll_claim", "recipe_scaling", "rent_split", "used_car"]
models = ["qwen", "gemini-3.5-flash"]
repeats = 2

# Covert-bias test on the 8 new personas (2026-11-25): does the non-native penalty survive the
# "ignore surface" instruction beyond the original 4? Qwen only, sized to its last ~76k free tokens.
[[cells]]
framings = ["third_person_debiased"]
variants = ["base", "l2"]
personas = ["deposit_dispute", "job_offers", "moving_day", "plant_dying",
            "poll_claim", "recipe_scaling", "rent_split", "used_car"]
models = ["qwen"]
repeats = 2

[[models]]
name = "gemini-3.5-flash"
provider = "openai_compat"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
# Pinned. On 2026-11-13 gemini-3.8-flash was overloaded (503 "high demand") and its free daily quota ran out
# on retries; gemini-3.7-flash and the gemini-flash-latest alias timed out; gemini-3.5-flash answered.
model = "gemini-3.5-flash"
api_key_env = "GEMINI_API_KEY"
# Since 2026-11-25 this key runs on prepaid credits (paid tier, about $0.004 per answer here), so the
# free-tier pacing is lifted. A 402 (credits used up) stops the run.
concurrency = 3
rpm = 60
timeout_s = 120
max_retries = 1
stop_after_overloads = 3          # 3 "high demand"/timeout errors in a row: stop rather than keep failing
# Spending cap: the owner keeps at least $2 of the $5 credit balance they had on 2026-11-25, so this model may
# spend at most $3 from that date (list prices). Gemini bills hidden "thinking" tokens as output (about 1,270
# per answer here, measured 2026-11-25), so a real answer costs about $0.016, not the $0.004 the visible
# tokens suggest. Answers recorded before thinking tokens were logged are assumed to have 1,300.
# 0.10 is held back for the four measurement calls made outside the harness that day.
budget_usd = 2.90
budget_since = "2026-11-25"
price_in_per_m = 1.50
price_out_per_m = 9.00
assumed_reasoning_tokens = 1300
# On a free tier instead: concurrency = 1, rpm = 8, max_retries = 0, and max_calls_per_run just under the daily limit.

[[models]]
name = "qwen"
provider = "openai_compat"
# Standard Singapore endpoint. The workspace's own endpoint
# (https://<workspace-id>.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1) listed models but
# returned 403 "Access to model denied" for chat on 2026-11-13, so this one is used instead.
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
model = "qwen3.7-plus"            # "Free Quota Only" is ON for this model; each model has its own 1M free tokens
api_key_env = "DASHSCOPE_API_KEY"
concurrency = 2
repeats = 3                       # ~1M free tokens covers this easily (~300 calls, roughly 200k tokens)

[[models]]
name = "surface-baseline"
provider = "surface"
