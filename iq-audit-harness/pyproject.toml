[project]
name = "iqaudit"
version = "0.1.0"
description = "Measure what moves an LLM's IQ estimate when the content of a chat log stays the same."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
all = ["anthropic", "openai"]

[project.scripts]
iqaudit = "iqaudit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iqaudit*"]
