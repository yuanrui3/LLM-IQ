# Synthetic persona. Every variant carries the same facts and reasoning steps as `base`,
# except `flawed`, which keeps the style of `base` but makes reasoning errors (positive control).
id = "plant_dying"
title = "Houseplants dying on one windowsill"
notes = """Systematic diagnosis: compare matched plants, rule out watering, weigh light against drainage
using the soil clue, one change per plant with one left alone, wait two weeks, verify.
Flawed version: jumps to the sun and dismisses the no-hole pots because every plant gets the same water,
reads the still-wet soil as support for the light theory, moves, repots and feeds all three at once,
credits the sun after 4 days and one new leaf."""
paste = "physics_abstract"

