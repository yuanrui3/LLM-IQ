  "Assuming gas at $3.50, A would consume 12,000 / 30 = 400 gallons per year versus 480 for B, which amortized over the full 5 years comes to $7,000 versus $8,400 in fuel spend",
  "On the maintenance side, my mechanic advises budgeting $800 annually in repairs for A given its mileage, versus $300 for B, so that's $4,000 versus $1,500 over the holding period",
