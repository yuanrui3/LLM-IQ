# Synthetic persona. Every variant carries the same facts and reasoning steps as `base`,
# except `flawed`, which keeps the style of `base` but makes reasoning errors (positive control).
id = "used_car"
title = "Choosing between two used cars"
notes = """Numeracy and spotting a warning sign: five-year cost of ownership (price, fuel, repairs),
then a listing whose stated history does not fit its mileage. Flawed version: waves off B's
5 mpg gap as about $50 a year (it is $280), counts the repair difference for one year instead
of five ($500, not $2,500), reads low miles on a 3-year rideshare car as a plus instead of a
sign of a rolled-back odometer, and skips the history report on the listing's word."""
paste = "legal_clause"

[variants.base]
review = "authored"
messages = [
  "ok down to two used cars, I'll keep whichever I buy for about 5 years",
  "A: $9,000, 110k miles, 30 mpg. B: $11,000, 60k miles, 25 mpg. I drive about 12k miles a year",
  "at $3.50 gas, A uses 12,000 / 30 = 400 gallons a year and B uses 480, so $7,000 vs $8,400 over 5 years",
  "my mechanic says budget $800 a year in repairs for A at that mileage and $300 for B, so $4,000 vs $1,500",
  "5-year totals: A $20,000, B $20,900, but B would resell for more, so pretty much even",
  "but B's listing says it was a rideshare car for 3 years. those usually do 25k+ miles a year, so 60k total looks way too low",
  "if the odometer's been rolled back, my repair numbers for B are off too. getting the history report and an inspection first",
]

