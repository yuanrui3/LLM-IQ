# Synthetic persona. Every variant carries the same facts and reasoning steps as `base`,
# except `flawed`, which keeps the style of `base` but makes reasoning errors (positive control).
id = "poll_claim"
title = "An online poll about a parking fee"
notes = """Statistical reasoning: self-selected sample, sample size vs randomness, leading wording, what a fair poll needs.
Flawed version: treats an open click-to-vote poll as fairer than sampling and assumes strong feelings
on both sides cancel out, gets 250 of 40,000 wrong (6% instead of about 0.6%), dismisses the leading
wording, treats size alone as what makes a real poll (250 volunteers as good as 400 random people)."""
paste = "python_code"

