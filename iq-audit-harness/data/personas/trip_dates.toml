# Synthetic persona. Every variant carries the same facts and reasoning steps as `base`,
# except `flawed`, which keeps the style of `base` but makes reasoning errors (positive control).
id = "trip_dates"
title = "Picking dates for a group trip"
notes = """Constraint satisfaction: five people's availability, cheapest departure day,
minimum stay, existing bookings. Flawed version ignores two constraints, assumes one away,
and picks a Friday-Saturday that is one night long and overlaps the existing booking."""
paste = "physics_abstract"

