  "she started it when she felt worst and improved right after, so the timing pretty much proves it",
  "the article quotes 'a study' too, a company survey of 200 customers, and most of them said it helped",
  "if 200 people say it worked that's basically a trial already, you don't really need a comparison group for something this obvious",
  "so I guess it actually works. ordering some now, going to tell the group chat she was right lol",
]

