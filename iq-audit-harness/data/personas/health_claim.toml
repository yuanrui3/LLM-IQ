# Synthetic persona. Every variant carries the same facts and reasoning steps as `base`,
# except `flawed`, which keeps the style of `base` but makes reasoning errors (positive control).
id = "health_claim"
title = "A relative's supplement claim"
notes = """Causal reasoning: natural recovery, regression to the mean, no control group.
Flawed version: treats natural recovery as the effect, takes timing as proof,
treats a customer survey as a trial, dismisses the need for a control group."""
paste = "physics_abstract"

[variants.base]
review = "authored"
messages = [
  "my aunt keeps sending the family group that zinc spray article",
  "her proof is she started using it on day 3 of her cold and was fine by day 6",
  "but colds usually clear up in about a week anyway, so that's exactly what would happen with no spray",
  "people also tend to start remedies when they feel worst, so almost anything taken then looks like it worked",
  "the article quotes 'a study' but it's a company survey of 200 customers with no comparison group",
  "what you'd want is a trial where half get the spray and half get a dummy spray and nobody knows which",
  "I'm not saying it does nothing, just that her cold isn't evidence either way. not going to argue in the group chat though lol",
]

[variants.flawed]
review = "authored"
messages = [
  "my aunt keeps sending the family group that zinc spray article",
  "her proof is she started using it on day 3 of her cold and was fine by day 6",
