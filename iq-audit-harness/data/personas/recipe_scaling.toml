# Synthetic persona. Every variant carries the same facts and reasoning steps as `base`,
# except `flawed`, which keeps the style of `base` but makes reasoning errors (positive control).
id = "recipe_scaling"
title = "Scaling a recipe from 4 servings to 9"
notes = """Proportional scaling with unit conversion (tsp, tbsp, cups) and a physical constraint:
2 pans give 2x the space for 2.25x the food, so the side is held at 2x; doneness by temperature, not time.
Flawed version: uses 4 tsp to the tbsp (so 1 tbsp of paprika instead of 1.5), calls 9 tbsp a third
of a cup (it is just over half), piles 2.25x onto one pan as if crowding cooks the same,
scales the cooking time by 2.25 (40 to 90 min) and drops the temperature check."""
paste = "python_code"

[variants.base]
review = "authored"
messages = [
  "having 9 people over saturday and my sheet pan chicken recipe only serves 4",
  "so everything x 9/4 = 2.25. 8 chicken thighs becomes 18, still 2 per person",
  "paprika is 2 tsp x 2.25 = 4.5 tsp, which is 1.5 tbsp since a tbsp is 3 tsp",
  "oil goes from 4 tbsp to 9, and a cup is 16 tbsp, so half a cup plus 1 tbsp",
  "the catch is space. the recipe fills one sheet pan, and cramming 2.25x on it would steam everything instead of browning it",
  "my oven fits 2 pans, one per rack, so 2x the space for 2.25x the food. I'll do 9 thighs per pan but keep the potatoes at 2x, 1600 g instead of 1800",
  "swapping racks halfway, and a full oven cooks slower, so I'll go by the thighs hitting 165°F, not the 40 min in the recipe",
]

