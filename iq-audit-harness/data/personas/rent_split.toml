# Synthetic persona. Every variant carries the same facts and reasoning steps as `base`,
# except `flawed`, which keeps the style of `base` but makes reasoning errors (positive control).
id = "rent_split"
title = "Splitting rent between three roommates"
notes = """Proportional and percentage reasoning: half the rent split equally for shared space,
half by bedroom area, totals checked against the rent, utilities split by usage not room size.
Flawed version: applies the room percentages to the whole $2400 on top of the equal shared half
(stated totals come to $3500), adds 400 + 720 as 1020, splits utilities by room size on the
unsupported assumption that bigger rooms use more power, says the math checks out without summing."""
paste = "legal_clause"

[variants.base]
review = "authored"
messages = [
  "ok trying to work out a fair rent split before the three of us sign the lease",
  "rent is $2400 a month. my room is 18 square meters, Jen's is 12 and Omar's is 10",
  "splitting purely by room size isn't quite fair since we all share the kitchen and living room equally",
  "so half the rent covers the shared space: $1200 split 3 ways is $400 each",
  "the other $1200 goes by bedroom size. 18 + 12 + 10 = 40 square meters, so I'm 45% = $540, Jen 30% = $360, Omar 25% = $300",
  "totals: me $940, Jen $760, Omar $700, and that adds back up to $2400",
  "utilities are about $150 and we all use them about the same no matter the room size, so $50 each. sending this to them tonight to see if the 50/50 part feels fair",
]

