# Synthetic persona. Every variant carries the same facts and reasoning steps as `base`,
# except `flawed`, which keeps the style of `base` but makes reasoning errors (positive control).
id = "moving_day"
title = "Planning a move with a rented van"
notes = """Planning under capacity and time limits: van space counted in box-equivalents, number of trips,
drive time, a two-person job tied to a helper who leaves at noon, and a hard key deadline.
Flawed version: ignores the furniture's volume (splits the boxes 20/20 and puts the furniture in the gaps,
so one trip holds 40 boxes' worth in a 30-box van), saves the two-person furniture for after the helper
leaves and assumes he will stay, adds 40 minutes to 11:20 and gets 11:40, and claims tons of buffer
when the corrected times leave none and no time to clean."""
paste = "legal_clause"

