review = "authored"
messages = [
  "ok planning saturday's move, got a rental van for the day",
  "40 boxes plus the couch, bed and dresser. the van fits about 30 boxes and the 3 big pieces take up the room of about 20",
  "so that's 60 boxes worth, 2 full trips. the drive is 40 min each way",
  "hard limits: keys back to the old landlord by 3pm, and Jake can only help till noon",
  "I can't lift the couch or dresser alone, so the furniture plus 10 boxes goes on trip 1 while Jake's here",
  "trip 1: load 9 to 10, there by 10:40, unload together by 11:20, back at the old place at 12 when he leaves",
  "trip 2 is the other 30 boxes, about an hour to load alone, so 12 to 1. sweep 30 min, hand the keys back at 1:30, then drive over. 90 min to spare",
]

