[variants.verbose]
review = "authored"
messages = [
  "Okay, so I'm currently weighing two competing job offers, and I've decided it's time to run a proper quantitative analysis rather than just going with my gut instinct",
  "On the compensation front, Offer A comes in at $72k with a 50-minute train commute each way and a $150 monthly transit pass, whereas Offer B sits at $65k with a 15-minute drive, complimentary parking, and roughly $50 a month in fuel",
  "Annualizing those commuting expenses, that's $1,800 versus $600 a year, which means that on a net-of-commute basis A lands at $70,200 while B lands at $64,400",
  "Additionally, B offers a 6% 401k match compared to A's 3%, which translates to $3,900 versus $2,160. Factoring that in holistically, we're looking at $72,360 versus $68,300, for a net delta of $4,060",
  "However, A carries an incremental 70 minutes of commuting per day, and across roughly 230 workdays that aggregates to approximately 268 hours annually",
  "So effectively, A is compensating me at $4,060 / 268 = roughly $15 an hour for that time, and quite frankly I wouldn't leverage my free time into a side gig at that rate",
  "At this point I'm leaning toward B. That said, both offers simply reference full health coverage, and variance in the deductibles could swing things by a few thousand, so in the interest of due diligence I'm requesting both plan documents first",
]

