# Synthetic persona. Every variant carries the same facts and reasoning steps as `base`,
# except `flawed`, which keeps the style of `base` but makes reasoning errors (positive control).
id = "job_offers"
title = "Comparing two job offers"
notes = """Numeracy: salary net of commute cost and retirement match, then the time cost of the
longer commute turned into an hourly rate. Flawed version: drops B's gas cost because parking
is free, leaves the 401k match out as not real pay, turns 16,100 minutes into 161 hours
(dividing by 100, not 60; it is about 268), and treats two full-coverage labels as the same plan."""
paste = "physics_abstract"

[variants.base]
review = "authored"
messages = [
  "ok two job offers, time to do the actual math instead of going with my gut",
  "A pays $72k, 50 min each way by train, $150 monthly pass. B pays $65k, 15 min drive, free parking, about $50 a month in gas",
  "so commuting is $1,800 vs $600 a year, which leaves A at $70,200 and B at $64,400",
  "B matches 6% on the 401k vs 3% at A: $3,900 vs $2,160, so really $72,360 vs $68,300, a $4,060 gap",
  "but A is 70 extra min a day, and over about 230 workdays that's around 268 hours a year",
  "so A pays me $4,060 / 268 = about $15 an hour for that time. I wouldn't take a side job for that",
  "leaning B, but both offers just say full health coverage, and deductibles could swing a few thousand, so asking for both plans first",
]

