intro = "saving this here so I don't lose it:"
text = """def moving_average(xs, k):
    window = sum(xs[:k])
    out = [window / k]
    for i in range(k, len(xs)):
        window += xs[i] - xs[i - k]
        out.append(window / k)
    return out"""
